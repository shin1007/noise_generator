<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#77f2d0"/>
      <stop offset="50%" stop-color="#7aa8ff"/>
      <stop offset="100%" stop-color="#ffbf69"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#0c111a"/>
  
  <!-- Decorative background elements -->
  <circle cx="1000" cy="100" r="300" fill="url(#g)" opacity="0.05"/>
  <circle cx="100" cy="530" r="200" fill="url(#g)" opacity="0.03"/>
  
  <!-- Wave patterns in background -->
  <path d="M0 450 Q 300 350 600 450 T 1200 450" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.1"/>
  <path d="M0 480 Q 300 380 600 480 T 1200 480" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.05"/>
  
  <!-- Main Content Group -->
  <g filter="url(#shadow)">
    <!-- Icon part (scaled and centered) -->
    <g transform="translate(140, 115)">
      <circle cx="200" cy="200" r="172" fill="none" stroke="url(#g)" stroke-width="24" opacity="0.25"/>
      <path d="M76 222c34-46 60-69 94-69 30 0 49 18 70 18 31 0 47-20 84-74" fill="none" stroke="url(#g)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M76 267c34-46 60-69 94-69 30 0 49 18 70 18 31 0 47-20 84-74" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
      <circle cx="120" cy="120" r="10" fill="#77f2d0"/>
      <circle cx="280" cy="120" r="10" fill="#ffbf69"/>
    </g>
    
    <!-- Text part -->
    <g transform="translate(520, 240)">
      <text font-family="'Avenir Next', 'SF Pro Display', sans-serif" font-weight="800" font-size="84" fill="#ffffff" letter-spacing="-0.02em">
        Noise <tspan fill="url(#g)">Generator</tspan>
      </text>
      <text y="75" font-family="'Avenir Next', 'SF Pro Display', sans-serif" font-weight="500" font-size="32" fill="#7aa8ff" opacity="0.9">
        Simple Noise &amp; Binaural Beats
      </text>
      <rect y="115" width="460" height="2" fill="url(#g)" opacity="0.3"/>
      <text y="160" font-family="'Avenir Next', 'SF Pro Display', sans-serif" font-weight="600" font-size="20" fill="#77f2d0" opacity="0.7" letter-spacing="0.1em">
        FOCUS • SLEEP • RELAX • MASKING
      </text>
    </g>
  </g>
  
  <!-- App characteristics footer-like tags -->
  <g transform="translate(100, 560)">
    <text font-family="sans-serif" font-size="16" fill="#ffffff" opacity="0.3">
      Open Source PWA • Web Audio API Powered • No Ads • No Tracking
    </text>
  </g>
</svg>
